<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="250">
  <defs>
    <!-- Define the "Leaf" Gradient: Vibrant Green to Light Lime -->
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" /> <!-- Vibrant Green -->
      <stop offset="100%" style="stop-color:#bef264;stop-opacity:1" /> <!-- Light Lime -->
    </linearGradient>
  </defs>
  <style>
    .ascii {
      font-family: Consolas, "Courier New", monospace;
      font-weight: bold;
      font-size: 15px; 
      fill: url(#leafGradient); /* Apply the new green gradient here */
      white-space: pre;
    }
    .emoji {
      font-size: 65px; /* Make the emoji big enough to match the 3D text */
    }
  </style>
  
  <!-- Left Leaf Emoji -->
  <text x="15%" y="50%" dominant-baseline="middle" text-anchor="middle" class="emoji">🍃</text>
  
  <!-- Center 3D ASCII Text -->
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="ascii">
    <tspan x="50%" dy="-3.5em">██╗    ██╗██╗███╗   ██╗██████╗        █████╗ ██╗  ██╗</tspan>
<tspan x="50%" dy="1.1em">██║    ██║██║████╗  ██║██╔══██╗      ██╔══██╗██║  ██║</tspan>
<tspan x="50%" dy="1.1em">██║ █╗ ██║██║██╔██╗ ██║██║  ██║█████╗╚██████║███████║</tspan>
<tspan x="50%" dy="1.1em">██║███╗██║██║██║╚██╗██║██║  ██║╚════╝ ╚═══██║╚════██║</tspan>
<tspan x="50%" dy="1.1em">╚███╔███╔╝██║██║ ╚████║██████╔╝       █████╔╝     ██║</tspan>
<tspan x="50%" dy="1.1em"> ╚══╝╚══╝ ╚═╝╚═╝  ╚═══╝╚═════╝        ╚════╝      ╚═╝</tspan>
<tspan x="50%" dy="1.1em">                                                     </tspan>
  </text>
  
  <!-- Right Leaf Emoji (For balance) -->
  <text x="85%" y="50%" dominant-baseline="middle" text-anchor="middle" class="emoji">🍃</text>
</svg>